# Database connection
# The ":-..." syntax provides a fallback if the environment variable isn't found
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/assessment_skill1level3}
spring.datasource.username=${DB_USERNAME:phea}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IMPORTANT: Removed MySQL8Dialect line. 
# Hibernate 7+ (used in Spring Boot 4) detects the dialect automatically.

# Prevents crash if DB is slightly slow to start
spring.datasource.hikari.initialization-fail-timeout=0